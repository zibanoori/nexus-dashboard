<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus</title>
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <span class="logo-icon">🌟</span>
            <span class="logo-test">Admin Pro</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="javascript:void(0)" class="nav-links active">
            <span class="icon">🏡</span>
            <span class="link-text">Dashboard</span>
          </a>
          <a href="javascript:void(0)" class="nav-links">
            <span class="icon">🛒</span>
            <span class="link-text">Users</span>
          </a>
          <a href="javascript:void(0)" class="nav-links">
            <span class="icon">📦</span>
            <span class="link-text">Producta</span>
          </a>
          <a href="javascript:void(0)" class="nav-links">
            <span class="icon">📊</span>
            <span class="link-text">Analitics</span>
          </a>
          <a href="javascript:void(0)" class="nav-links">
            <span class="icon">⚙️</span>
            <span class="link-text">Settings</span>
          </a>
        </nav>
        <button id="sidebar-toggle" class="sidebar-toggle">⬅️</button>
      </aside>
      <div class="main">
        <header class="header">
          <div>
            <h1>Admin Area</h1>
            <p>Welcome back Admin!</p>
          </div>
          <div class="profile">
            <div class="avatar">A</div>
            <span>Admin</span>
          </div>
        </header>

        <main class="content">
          <div class="cards">
            <div class="stat-card">
              <span class="stat-icon">💰</span>
              <div>
                <p>Total Revenue</p>
                <h2>16000$</h2>
              </div>
            </div>
            <div class="stat-card">
              <span class="stat-icon">👥</span>
              <div>
                <p>Total Users</p>
                <h2>69500</h2>
              </div>
            </div>
            <div class="stat-card">
              <span class="stat-icon">📦</span>
              <div>
                <p>Total Orders</p>
                <h2>1800</h2>
              </div>
            </div>
            <div class="stat-card">
              <span class="stat-icon">👁️</span>
              <div>
                <p>Page Views</p>
                <h2>12.5k</h2>
              </div>
            </div>
          </div>
          <section class="Welcome">
            <h2>Welcome to Admin Pro!</h2>
            <p>Here is your daily activity summary and key performance metrics</p>
          </section>
        </main>
      </div>
    </div>

    <script src="assets/script/main.js"></script>
  </body>
</html>
